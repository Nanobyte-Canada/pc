# Portfolio Production Deploy
name: portfolio-prod

services:
  backend:
    image: ghcr.io/nanobyte-canada/portfolio-backend:${IMAGE_TAG}
    container_name: prod-portfolio-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://prod-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: prod-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_VERSION: ${IMAGE_TAG}
      APP_ENVIRONMENT: prod
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY}
      BROKER_GATEWAY_URL: http://prod-portfolio-broker-gateway:8084
      BROKER_SYNC_ENABLED: ${BROKER_SYNC_ENABLED:-true}
      BROKER_SYNC_CRON: ${BROKER_SYNC_CRON:-0 20 16 * * *}
      BROKER_SYNC_CRON_MORNING: ${BROKER_SYNC_CRON_MORNING:-0 0 6 * * *}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://portfolio.nanobyte.ca/auth/google/callback}
      CORS_ALLOWED_ORIGINS: https://portfolio.nanobyte.ca
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
    ports:
      - "10080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network
      - infra-prod-network

  ingestion-service:
    image: ghcr.io/nanobyte-canada/portfolio-ingestion:${IMAGE_TAG}
    container_name: prod-portfolio-ingestion
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://prod-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: prod-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
    ports:
      - "10081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network
      - infra-prod-network

  market-data-service:
    image: ghcr.io/nanobyte-canada/portfolio-market-data:${IMAGE_TAG}
    container_name: prod-portfolio-market-data
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://prod-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: prod-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUESTRADE_REFRESH_TOKEN: ${QUESTRADE_REFRESH_TOKEN:-}
      QUESTRADE_USE_PRACTICE: ${QUESTRADE_USE_PRACTICE:-false}
    ports:
      - "10082:8082"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network
      - infra-prod-network

  strategy-service:
    image: ghcr.io/nanobyte-canada/portfolio-strategy:${IMAGE_TAG}
    container_name: prod-portfolio-strategy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://prod-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: prod-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MARKET_DATA_SERVICE_URL: http://prod-portfolio-market-data:8082
      PORTFOLIO_SERVICE_URL: http://prod-portfolio-backend:8080
    ports:
      - "10083:8083"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network
      - infra-prod-network

  broker-gateway-service:
    image: ghcr.io/nanobyte-canada/portfolio-broker-gateway:${IMAGE_TAG}
    container_name: prod-portfolio-broker-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://prod-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: prod-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      QUESTRADE_ENABLED: "true"
      WEALTHSIMPLE_ENABLED: "true"
    ports:
      - "10084:8084"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network
      - infra-prod-network

  frontend:
    image: ghcr.io/nanobyte-canada/portfolio-frontend:${IMAGE_TAG}
    container_name: prod-portfolio-frontend
    ports:
      - "10000:80"
    environment:
      - VITE_AUTH_METHOD=google
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - prod-internal-network

networks:
  prod-internal-network:
    external: true
  infra-prod-network:
    external: true
