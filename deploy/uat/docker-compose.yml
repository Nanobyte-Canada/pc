# Portfolio UAT Deploy
name: portfolio-uat

services:
  backend:
    image: ghcr.io/nanobyte-canada/portfolio-backend:${IMAGE_TAG}
    container_name: uat-portfolio-backend
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DATABASE_URL: jdbc:postgresql://uat-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: uat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_VERSION: ${IMAGE_TAG}
      APP_ENVIRONMENT: uat
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY}
      BROKER_GATEWAY_URL: http://uat-portfolio-broker-gateway:8084
      BROKER_SYNC_ENABLED: ${BROKER_SYNC_ENABLED:-true}
      BROKER_SYNC_CRON: ${BROKER_SYNC_CRON:-0 20 16 * * *}
      BROKER_SYNC_CRON_MORNING: ${BROKER_SYNC_CRON_MORNING:-0 0 6 * * *}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://uatportfolio.nanobyte.ca/auth/google/callback}
      CORS_ALLOWED_ORIGINS: https://uatportfolio.nanobyte.ca
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
    ports:
      - "20080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network
      - infra-uat-network

  ingestion-service:
    image: ghcr.io/nanobyte-canada/portfolio-ingestion:${IMAGE_TAG}
    container_name: uat-portfolio-ingestion
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DATABASE_URL: jdbc:postgresql://uat-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: uat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
    ports:
      - "20081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network
      - infra-uat-network

  market-data-service:
    image: ghcr.io/nanobyte-canada/portfolio-market-data:${IMAGE_TAG}
    container_name: uat-portfolio-market-data
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DATABASE_URL: jdbc:postgresql://uat-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: uat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUESTRADE_REFRESH_TOKEN: ${QUESTRADE_REFRESH_TOKEN:-}
      QUESTRADE_USE_PRACTICE: ${QUESTRADE_USE_PRACTICE:-false}
    ports:
      - "20082:8082"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network
      - infra-uat-network

  strategy-service:
    image: ghcr.io/nanobyte-canada/portfolio-strategy:${IMAGE_TAG}
    container_name: uat-portfolio-strategy
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DATABASE_URL: jdbc:postgresql://uat-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: uat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MARKET_DATA_SERVICE_URL: http://uat-portfolio-market-data:8082
      PORTFOLIO_SERVICE_URL: http://uat-portfolio-backend:8080
    ports:
      - "20083:8083"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network
      - infra-uat-network

  broker-gateway-service:
    image: ghcr.io/nanobyte-canada/portfolio-broker-gateway:${IMAGE_TAG}
    container_name: uat-portfolio-broker-gateway
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DATABASE_URL: jdbc:postgresql://uat-postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: uat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      QUESTRADE_ENABLED: "true"
      WEALTHSIMPLE_ENABLED: "true"
    ports:
      - "20084:8084"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network
      - infra-uat-network

  frontend:
    image: ghcr.io/nanobyte-canada/portfolio-frontend-uat:${IMAGE_TAG}
    container_name: uat-portfolio-frontend
    ports:
      - "20000:80"
    environment:
      - VITE_AUTH_METHOD=both
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    networks:
      - uat-internal-network

networks:
  uat-internal-network:
    external: true
  infra-uat-network:
    external: true
