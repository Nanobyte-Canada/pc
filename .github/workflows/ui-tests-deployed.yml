name: UI Tests — Deployed

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]

concurrency:
  group: portfolio-uat-deploy
  cancel-in-progress: false

jobs:
  smoke-tests:
    name: Smoke Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        working-directory: e2e
        env:
          BASE_URL: https://uatportfolio.nanobyte.ca

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: e2e/test-results/**/trace.zip
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: e2e/test-results/**/screenshot.png
          retention-days: 14

  regression-tests:
    name: Regression Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run regression tests
        run: npx playwright test --grep @regression
        working-directory: e2e
        env:
          BASE_URL: https://uatportfolio.nanobyte.ca

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: e2e/test-results/**/trace.zip
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: e2e/test-results/**/screenshot.png
          retention-days: 14

  accessibility-tests:
    name: Accessibility Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: [regression-tests]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run accessibility tests
        run: npx playwright test --grep @accessibility
        working-directory: e2e
        env:
          BASE_URL: https://uatportfolio.nanobyte.ca

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: e2e/test-results/
          retention-days: 14

  visual-tests:
    name: Visual Regression Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: [accessibility-tests]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run visual regression tests
        run: npx playwright test --grep @visual
        working-directory: e2e
        env:
          BASE_URL: https://uatportfolio.nanobyte.ca

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload visual snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/test-results/**/screenshot.png
          retention-days: 14

  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [smoke-tests, regression-tests, accessibility-tests, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: UI Tests failed on *uat*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
