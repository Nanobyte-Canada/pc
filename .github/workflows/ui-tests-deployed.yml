name: UI Tests — Deployed

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - smoke
      update_visual_baselines:
        description: "Run visual suite with --update-snapshots and commit new baselines"
        required: false
        type: boolean
        default: false

concurrency:
  group: portfolio-uat-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  VAULT_ADDR: https://vault.nanobyte.ca

jobs:
  smoke-tests:
    name: Smoke Tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
      BASE_URL: https://uatportfolio.nanobyte.ca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        working-directory: e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: e2e/results/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: e2e/results/**/trace.zip
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: e2e/results/**/screenshot.png
          retention-days: 14

  regression-tests:
    name: Regression Tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    needs: [smoke-tests]
    environment: uat
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
      BASE_URL: https://uatportfolio.nanobyte.ca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Fetch test credentials from Vault
        run: |
          VAULT_TOKEN=$(curl -sf \
            --data "{\"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${VAULT_ADDR}/v1/auth/approle/login" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).auth?.client_token || ''")
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::Vault AppRole authentication failed"
            exit 1
          fi
          KVDATA=$(curl -sf --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/portfolio/uat" || echo '{}')
          EMAIL=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_EMAIL) || ''" "$KVDATA")
          PASSWORD=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_PASSWORD) || ''" "$KVDATA")
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::APP_TEST_ADMIN_EMAIL/APP_TEST_ADMIN_PASSWORD missing or empty in Vault (secret/data/portfolio/uat)"
            exit 1
          fi
          {
            echo "APP_TEST_ADMIN_EMAIL=$EMAIL"
            echo "APP_TEST_ADMIN_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run regression tests
        run: npx playwright test --grep @regression
        working-directory: e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: e2e/results/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: e2e/results/**/trace.zip
          retention-days: 14

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: e2e/results/**/screenshot.png
          retention-days: 14

  accessibility-tests:
    name: Accessibility Tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    needs: [regression-tests]
    environment: uat
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
      BASE_URL: https://uatportfolio.nanobyte.ca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Fetch test credentials from Vault
        run: |
          VAULT_TOKEN=$(curl -sf \
            --data "{\"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${VAULT_ADDR}/v1/auth/approle/login" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).auth?.client_token || ''")
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::Vault AppRole authentication failed"
            exit 1
          fi
          KVDATA=$(curl -sf --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/portfolio/uat" || echo '{}')
          EMAIL=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_EMAIL) || ''" "$KVDATA")
          PASSWORD=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_PASSWORD) || ''" "$KVDATA")
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::APP_TEST_ADMIN_EMAIL/APP_TEST_ADMIN_PASSWORD missing or empty in Vault (secret/data/portfolio/uat)"
            exit 1
          fi
          {
            echo "APP_TEST_ADMIN_EMAIL=$EMAIL"
            echo "APP_TEST_ADMIN_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run accessibility tests
        run: npx playwright test --grep @a11y
        working-directory: e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: e2e/results/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: e2e/playwright-report/
          retention-days: 14

  visual-tests:
    name: Visual Regression Tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main')
    needs: [accessibility-tests]
    environment: uat
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HOME: /root
      BASE_URL: https://uatportfolio.nanobyte.ca
    steps:
      - name: Install git-lfs
        run: |
          apt-get update && apt-get install -y git-lfs
          git lfs install

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Fetch test credentials from Vault
        run: |
          VAULT_TOKEN=$(curl -sf \
            --data "{\"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${VAULT_ADDR}/v1/auth/approle/login" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).auth?.client_token || ''")
          if [ -z "$VAULT_TOKEN" ]; then
            echo "::error::Vault AppRole authentication failed"
            exit 1
          fi
          KVDATA=$(curl -sf --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/portfolio/uat" || echo '{}')
          EMAIL=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_EMAIL) || ''" "$KVDATA")
          PASSWORD=$(node -pe "(JSON.parse(process.argv[1]||'{}').data?.data?.APP_TEST_ADMIN_PASSWORD) || ''" "$KVDATA")
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::APP_TEST_ADMIN_EMAIL/APP_TEST_ADMIN_PASSWORD missing or empty in Vault (secret/data/portfolio/uat)"
            exit 1
          fi
          {
            echo "APP_TEST_ADMIN_EMAIL=$EMAIL"
            echo "APP_TEST_ADMIN_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run visual regression tests
        working-directory: e2e
        run: |
          ARGS="--grep @visual"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_visual_baselines }}" = "true" ]; then
            ARGS="$ARGS --update-snapshots"
          fi
          npx playwright test $ARGS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: e2e/results/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload visual snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/results/**/screenshot.png
          retention-days: 14

      - name: Commit updated visual baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines == true
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/visual
          if git diff --cached --quiet; then
            echo "No visual baseline changes to commit"
            exit 0
          fi
          git commit -m "chore(testing): update visual baselines"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            git fetch --depth 1 origin ${{ github.ref_name }} && git rebase FETCH_HEAD || true
          done
          exit 1

  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [smoke-tests, regression-tests, accessibility-tests, visual-tests]
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: UI Tests failed on *uat*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
