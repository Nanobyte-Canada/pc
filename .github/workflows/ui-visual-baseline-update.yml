name: UI Visual Baseline Update

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

concurrency:
  group: visual-baseline-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Update Visual Baselines
    if: >-
      github.event.label.name == 'visual-baseline-update' ||
      (github.event_name == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'visual-baseline-update')) ||
      (github.event_name == 'reopened' && contains(github.event.pull_request.labels.*.name, 'visual-baseline-update'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Safety check — refuse on main
        if: github.base_ref == 'main' && github.head_ref == 'main'
        run: |
          echo "::error::Visual baseline updates are not allowed to run on main branch."
          exit 1

      - name: Verify PR author is authorized
        run: |
          AUTHOR="${{ github.actor }}"
          # Check if author is in CODEOWNERS for e2e paths
          if grep -q "$AUTHOR" .github/CODEOWNERS 2>/dev/null; then
            echo "✅ Author '$AUTHOR' is listed in CODEOWNERS."
          else
            echo "::error::Author '$AUTHOR' is not in CODEOWNERS. Only CODEOWNERS-approved contributors may update visual baselines."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Determine impacted visual tests
        id: impact
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'e2e/tests/visual/' 'e2e/pages/')
          if [ -z "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No visual test or page changes detected."
          else
            echo "Changed files:"
            echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright with --update-snapshots
        run: npx playwright test --project=chromium --update-snapshots e2e/tests/visual/
        working-directory: e2e
        env:
          CI: "true"

      - name: Copy before/after diffs for artifacts
        if: always()
        run: |
          mkdir -p visual-diff
          find e2e/tests/visual -name '*.png' -path '*-snapshots*' -exec cp --parents {} visual-diff/ \; 2>/dev/null || true
          find e2e/results -name '*.png' -exec cp --parents {} visual-diff/ \; 2>/dev/null || true

      - name: Upload before/after diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: visual-diff/
          retention-days: 3

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add e2e/tests/visual/**/*-snapshots/**

          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(e2e): update visual regression baselines"
            git push
          fi

      - name: Post summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "### Visual Baselines Updated :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Visual Baseline Update Failed :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the committed snapshot changes in the PR diff." >> "$GITHUB_STEP_SUMMARY"
